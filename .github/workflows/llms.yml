# Keeps llms.txt and llms-full.txt in step with the docs.
#
# Runs when a doc changes on main, including edits made in GitHub's web editor,
# where the local pre-commit hook can't run. If the generated files changed, it
# commits them back as github-actions[bot].
#
# Security:
#  - Runs only for pushes to main (code that's already been reviewed), never for pull
#    requests from forks.
#  - It's the only workflow with write access, and only to repository contents.
#  - No dependencies are installed: it runs the project's own zero-dependency script.
#  - Commits made with GITHUB_TOKEN don't trigger further workflow runs, so it can't loop.
name: Keep docs for AI assistants up to date

on:
  push:
    branches: [main]
    paths:
      - README.md
      - HELP.md
      - SECURITY.md
      - ADMIN.md
      - ADDITIONAL-PERMISSION.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - config.example.jsonc
      - scripts/build-llms.mjs
      - package.json
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: llms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regenerate llms.txt and llms-full.txt
        run: node scripts/build-llms.mjs
      - name: Commit them if they changed
        run: |
          if git diff --quiet -- llms.txt llms-full.txt; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt
          git commit -m "docs: regenerate llms.txt and llms-full.txt"
          git push
