# Publishes a release when you push a version tag (git tag v0.2.0 && git push --tags).
#
# What it does, in order:
#  1. Refuses unless the tag matches package.json and CHANGELOG.md has that version.
#  2. Runs the full test, secret, package, docs, coverage and mutation checks.
#  3. Builds the npm package once, writes its SHA-256 checksum, and records a signed
#     build-provenance attestation, so anyone can verify the file came from this workflow:
#        gh attestation verify claude-autoroute-<version>.tgz --repo <owner>/<repo>
#  4. Creates a GitHub Release with the package and checksum attached.
#
# It does not publish to npm. Do that by hand (npm publish <file>.tgz) once you're
# ready, so the package on npm is byte-for-byte the attested one.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag, package.json and CHANGELOG agree
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./package.json").version')" || { echo "tag $GITHUB_REF_NAME doesn't match package.json"; exit 1; }
          grep -q "^## \[\?$version\]\?" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          if grep -qi "^## \[\?$version\]\?.*unreleased" CHANGELOG.md; then echo "CHANGELOG.md still marks $version as unreleased"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: All checks
        run: |
          npm test
          npm run check:secrets
          npm run check:pack
          node scripts/build-llms.mjs --check
          npm run test:coverage
          npm run test:mutation
      - name: Build the package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          npm pack --silent --pack-destination dist >/dev/null
          cd dist && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --title "v$VERSION" --notes "$notes" --verify-tag
